name: Dependabot auto-merge

# Policy for Dependabot PRs (outputs from dependabot/fetch-metadata@v3):
#   - patch + minor updates (any ecosystem)            -> approve + auto-merge
#   - major updates to GitHub Actions (github_actions)
#     or to dev-only deps (direct:development)         -> approve + auto-merge
#   - any other major (direct:production, indirect)    -> label needs-review, leave open
# Auto-merge waits for the required status checks on main, so CI still gates
# every merge. Requires "Allow auto-merge" + branch protection on main.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      - name: Enable auto-merge for major updates to CI actions and dev-only dependencies
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          (steps.meta.outputs.package-ecosystem == 'github_actions' ||
           steps.meta.outputs.dependency-type == 'direct:development')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --remove-label "needs-review" || true
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      - name: Flag other major updates for review
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          steps.meta.outputs.dependency-type != 'direct:development'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review"
          gh pr comment "$PR_URL" --body "Major version bump (\`${{ steps.meta.outputs.dependency-names }}\`) — left open for manual review. Not auto-merged."
